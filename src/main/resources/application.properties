spring.application.name=stock-market-screener
server.port=8085

# PostgreSQL remains the normal runtime database; supply DB_PASSWORD explicitly.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stock_market_screener?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=health,info
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4300}
app.console.enabled=${APP_CONSOLE_ENABLED:false}

# Explicit synthetic development mode only. Never included in historical evidence.
app.market-data.mock-enabled=${MARKET_DATA_MOCK_ENABLED:false}
app.analysis.min-samples=${ANALYSIS_MIN_SAMPLES:30}
app.analysis.cache-seconds=${ANALYSIS_CACHE_SECONDS:60}
app.analysis.cache-size=${ANALYSIS_CACHE_SIZE:100}
app.analysis.calls-per-minute=${MARKET_DATA_CALLS_PER_MINUTE:30}
app.analysis.slippage-bps=${ANALYSIS_SLIPPAGE_BPS:5}
app.analysis.fee-bps=${ANALYSIS_FEE_BPS:10}
app.analysis.atr-multiple=${ANALYSIS_ATR_MULTIPLE:1.5}
app.analysis.target-r=${ANALYSIS_TARGET_R:1.5}
app.analysis.max-intraday-risk-pct=${ANALYSIS_MAX_INTRADAY_RISK_PCT:3}
app.analysis.max-swing-risk-pct=${ANALYSIS_MAX_SWING_RISK_PCT:8}
